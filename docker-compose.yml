version: "3.8"

services:
  hospital-scheduler:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    # Uncomment the following to mount source for local development
    # volumes:
    #   - ./target:/app/target
