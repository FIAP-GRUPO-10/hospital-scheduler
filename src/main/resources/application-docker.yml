# ==============================
# CONFIGURAÇÃO DO SERVIDOR
# ==============================
server:
  port: 8080 # Porta da aplicação (deve bater com docker-compose)

# ==============================
# CONFIGURAÇÃO DO SPRING
# ==============================
spring:
  application:
    name: food # Nome da aplicação

  # ==========================
  # BANCO DE DADOS (MYSQL)
  # ==========================
  datasource:
    url: jdbc:mysql://food-mysql:3306/fooddb # Nome do serviço no docker-compose
    username: ${MYSQL_USER} # Vem do .env
    password: ${MYSQL_PASSWORD} # Vem do .env
    driver-class-name: com.mysql.cj.jdbc.Driver

    # Pool de conexões (HikariCP)
    hikari:
      maximum-pool-size: 10 # Máximo de conexões
      minimum-idle: 5 # Conexões mínimas ociosas
      pool-name: HikariPool-Food # Nome do pool (log/debug)
      auto-commit: true # Commit automático

  # ==========================
  # JPA / HIBERNATE
  # ==========================
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.MySQL8Dialect
      ddl-auto: update # Atualiza schema automaticamente (NÃO usar em produção)

    properties:
      hibernate:
        format_sql: true # Formata SQL no log
        show_sql: false # Evita poluição no log
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==============================
# ACTUATOR / MONITORAMENTO
# ==============================
management:
  endpoint:
    health:
      show-details: never # Não expõe detalhes sensíveis
      show-components: never
      probes:
        enabled: false # Desativa readiness/liveness

jwt:
  secret: ${JWT_SECRET} # Vem do .env
  expiration: ${JWT_EXPIRATION} # Vem do .env