spring:
  datasource:
    url: jdbc:h2:mem:fiap-fastfood
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  docker:
    compose:
      enabled: false

jwt:
  secret: IMvCkrq577YvcmXLyRJuitNefug5L5OXRz3SiSHQbp0=
  expiration: 3600000

logging:
  level:
    org.springframework.security: DEBUG